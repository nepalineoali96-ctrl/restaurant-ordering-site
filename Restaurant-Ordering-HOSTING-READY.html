<script>

const DB={

  set(k,v){try{localStorage.setItem('nof_'+k,JSON.stringify(v));}catch(e){toast('Local storage unavailable.')} return true}
};

async function ensureCustomerAuth(){
  if(!FIREBASE_ONLINE||!AUTH()) return null;
  if(AUTH().currentUser) return AUTH().currentUser;
  try{const r=await AUTH().signInAnonymously();return r.user}catch(e){console.warn('Anonymous auth failed',e);toast('Firebase customer sign-in failed. Enable Anonymous sign-in in Firebase Authentication.');return null}
}
function isOwner(){return !!(AUTH()&&AUTH().currentUser&&AUTH().currentUser.uid===OWNER_UID)}

async function loadCloudCatalog(){
  if(!FIREBASE_ONLINE)return;
  try{
    const [c,f]=await Promise.all([FS().collection('appState').doc('cats').get(),FS().collection('appState').doc('foods').get()]);
    if(c.exists&&c.data().value)S.cats=c.data().value;
    if(f.exists&&f.data().value)S.foods=f.data().value;
    DB.set('cats',S.cats);DB.set('foods',S.foods);
  }catch(e){console.warn('Catalog load failed',e)}
}

function syncCatalog(){
  if(!FIREBASE_ONLINE)return;
  ['cats','foods'].forEach(k=>FS().collection('appState').doc(k).onSnapshot(s=>{
    if(!s.exists)return; const v=s.data().value;if(v===undefined)return;
    DB.set(k,v);if(typeof S!=='undefined'&&S.foods){S[k]=v;if(!$('#layer').innerHTML&&!['checkout'].includes(S.view))render();}
  },e=>console.warn('Catalog listener failed',k,e)));
}

async function cloudCreateOrder(o){
  const u=await ensureCustomerAuth();
  if(!u)throw new Error('Customer authentication unavailable');
  o.customerUid=u.uid;o.restaurantId=RESTAURANT_ID;
  await FS().collection('orders').doc(o.id).set(o);
  return o;
}

function watchCustomerOrders(){
  if(!FIREBASE_ONLINE)return;
  ensureCustomerAuth().then(u=>{if(!u)return;
    FS().collection('orders').where('customerUid','==',u.uid).where('restaurantId','==',RESTAURANT_ID).onSnapshot(s=>{
      const arr=s.docs.map(d=>d.data()).sort((a,b)=>(b.created||0)-(a.created||0));
      S.orders=arr;DB.set('orders',arr);
      arr.forEach(o=>{if(!S.my.includes(o.id))S.my.push(o.id)});DB.set('my',S.my);
      if(!$('#layer').innerHTML&&!['checkout'].includes(S.view))render();
    },e=>console.warn('Customer order listener failed',e));
  });
}

function watchAdminOrders(){
  if(!isOwner())return;
  FS().collection('orders').where('restaurantId','==',RESTAURANT_ID).onSnapshot(s=>{
    S.orders=s.docs.map(d=>d.data()).sort((a,b)=>(b.created||0)-(a.created||0));

  const o=snap.data();const log=Array.isArray(o.log)?o.log.slice():[];log.push({s:status,t:Date.now()});
  await ref.update({status,log});
}

  else if(sl==='completed') status='Delivered';
  if(!STAT.includes(status)) status='Pending';
  return {...raw,id,restaurantId:rid,customer,items,total:Number(raw.total || raw.amount || 0),status,payment:raw.payment || 'Cash on Delivery',created:Number(raw.created || raw.timestamp || Date.now())};
}
function watchAdminOrders(){
  if(!FIREBASE_ONLINE||!isOwner()) return;
  try{if(adminOrdersUnsub)adminOrdersUnsub();}catch(e){}
  const db=FS();
  const apply=(docs)=>{
    const map=new Map();
    docs.forEach(d=>{
      const o=normalizeAdminOrder(d);
      if(o.restaurantId===RESTAURANT_ID || o.restaurantId==='' || o.restaurantId==null) map.set(o.id,o);
    });
    S.orders=[...map.values()].sort((a,b)=>(b.created||0)-(a.created||0));
    DB.set('orders',S.orders);
    if(S.view==='admin') render();
  };
  // Read the whole orders collection, then filter locally so both
  // restaurantId and legacy restaurantid documents are supported.
  db.collection('orders').get().then(s=>apply(s.docs)).catch(e=>{
    console.error('Admin orders initial load failed',e);
    toast('Cannot read orders: '+(e.code||e.message||'permission denied'));
  });
  const unsub=db.collection('orders').onSnapshot(s=>apply(s.docs),e=>{
    console.error('Admin orders listener failed',e);
    toast('Live orders error: '+(e.code||e.message||'permission denied'));
  });
  adminOrdersUnsub=()=>{try{unsub()}catch(e){}};
}
function watchCustomerOrders(){
  if(!FIREBASE_ONLINE||!AUTH())return;
  const u=AUTH().currentUser;if(!u)return;
  FS().collection('orders').where('customerUid','==',u.uid).where('restaurantId','==',RESTAURANT_ID).onSnapshot(s=>{
    const cloud=s.docs.map(d=>d.data()).sort((a,b)=>(b.created||0)-(a.created||0));
    if(cloud.length){S.orders=cloud;try{localStorage.setItem('nof_orders',JSON.stringify(cloud));}catch(e){}}
    if(['orders','done'].includes(S.view)&&!$('#layer').innerHTML)render();
  },e=>console.warn('Customer order listener failed',e));
}
async function saveOrderStatus(id,status){
  if(!isOwner())throw new Error('Owner login required');
  const ref=FS().collection('orders').doc(id);
  const snap=await ref.get();if(!snap.exists)throw new Error('Order not found');
  const o=snap.data(),log=o.log||[];log.push({s:status,t:Date.now()});
  await ref.update({status,log});
}

function sheet(h){

function go(v){
  $('#layer').innerHTML='';S.view=v;render();window.scrollTo({top:0});
  const st=history.state||{};
  if(st.sheet)history.replaceState({v},'');else if(st.v!==v)history.pushState({v},'');
}
let lastBack=0;
window.addEventListener('popstate',e=>{
  const L=$('#layer');
  if(L&&L.innerHTML){L.innerHTML='';return}
  const v=e.state&&e.state.v;

async function place(){
  const name=$('#cn').value.trim(),phone=$('#cp').value.trim(),address=$('#ca').value.trim(),note=$('#cx').value.trim();
  S.customer={name,phone,address};S.err={};
  if(name.length<2)S.err.name='Please enter your full name.';
  if(!/^9[78]\d{8}$/.test(phone))S.err.phone='Enter a valid 10-digit Nepali mobile number (98/97…).';
  if(address.length<6)S.err.address='Please enter a complete delivery address.';
  if(Object.keys(S.err).length){render();return toast('Please fix the highlighted fields')}
  const its=cartItems();const bad=its.find(i=>!i.f.avail);
  if(bad)return toast(`${bad.f.name} is sold out. Remove it first.`);
  const b=$('#pb');b.disabled=true;b.textContent='Placing order…';
  try{
    const t=totals(its),u=await ensureCustomerAuth();
    if(!u)throw new Error('Customer sign-in failed. Enable Anonymous sign-in in Firebase Authentication.');
    const o={id:'NOF-'+Math.floor(10000+Math.random()*89999),restaurantId:RESTAURANT_ID,customerUid:u.uid,
      items:its.map(i=>({id:i.f.id,name:i.f.name,emoji:i.f.emoji,price:i.f.price,qty:i.q})),
      sub:t.sub,fee:t.fee,total:t.total,customer:{name,phone,address,note},status:'Pending',payment:'Cash on Delivery',created:Date.now(),log:[{s:'Pending',t:Date.now()}]};
    await cloudCreateOrder(o);
    S.orders=DB.get('orders',[]);S.orders.unshift(o);S.my.unshift(o.id);
    const ci=S.customers.findIndex(x=>x.phone===phone),rec={name,phone,address,last:Date.now()};
    ci>-1?S.customers[ci]=rec:S.customers.push(rec);
    S.cart={};['orders','my','customer','customers','cart'].forEach(save);
    S.last=o.id;S.err={};go('done');toast('Order sent to restaurant');
  }catch(e){console.error(e);b.disabled=false;b.textContent=`Place order · ${rs(totals(its).total)}`;toast(e.message||'Could not place order')}
}

  const f=id?food(id):{name:'',cat:S.cats[0]||'',price:'',emoji:'🍽️',desc:'',img:'',avail:true};
  if(!S.cats.length)return toast('Add a category first');
  sheet(`<h3 style="margin-top:0">${id?'Edit food':'Add food'}</h3>
  <label class="f">Name</label><input class="fi" id="fn" value="${esc(f.name)}">
  <label class="f">Category</label><select class="fi" id="fc">${S.cats.map(c=>`<option ${c===f.cat?'selected':''}>${esc(c)}</option>`).join('')}</select>
  <div class="row"><div style="flex:1"><label class="f">Price (Rs.)</label><input class="fi" id="fp" type="number" min="0" value="${f.price}"></div><div style="width:90px"><label class="f">Emoji</label><input class="fi" id="fe" value="${esc(f.emoji)}" maxlength="4"></div></div>
  <label class="f">Description</label><textarea class="fi" id="fd" rows="2">${esc(f.desc)}</textarea>
  <label class="f">Food photo</label>
  <div id="pv" class="big" style="height:130px;font-size:48px;${vis(f).bg}"></div>
  <div class="row"><label class="btn blue sm" style="cursor:pointer;flex:1">📷 Upload photo<input type="file" accept="image/*" id="ff" style="display:none" onchange="pickImg(this)"></label><button class="btn gray sm" onclick="S.tmpImg='';$('#fi').value='';updPv()">Remove photo</button></div>
  <label class="f">…or paste image link (optional)</label><input class="fi" id="fi" placeholder="https://…" value="${f.img&&!f.img.startsWith('data:')?esc(f.img):''}" oninput="S.tmpImg=this.value.trim();updPv()">
  <div class="row sp" style="margin:14px 0"><span>Available for order</span><label class="sw"><input type="checkbox" id="fa" ${f.avail?'checked':''}><i></i></label></div>
  <div class="err" id="fer"></div><button class="btn" onclick="saveFood('${id||''}')">Save food</button><button class="btn gray" style="margin-top:8px" onclick="closeSheet()">Cancel</button>`);
  S.tmpImg=f.img||'';updPv();
}
function updPv(){
  const p=$('#pv');if(!p)return;const e=($('#fe')&&$('#fe').value)||'🍽️';
  p.innerHTML=e+(S.tmpImg?`<img src="${esc(S.tmpImg)}" alt="" onerror="this.remove()">`:'');
}
function pickImg(inp){
  const file=inp.files&&inp.files[0];if(!file)return;
  if(!/^image\//.test(file.type))return toast('Please choose an image file');
  const rd=new FileReader();
  rd.onerror=()=>toast('Could not read the photo');
  rd.onload=()=>{
    const im=new Image();
    im.onerror=()=>toast('Could not open that image');
    im.onload=()=>{
      const M=640,k=Math.min(1,M/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      S.tmpImg=c.toDataURL('image/jpeg',.75);$('#fi').value='';updPv();toast('Photo added. Tap Save food.');
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(file);
}
function saveFood(id){
  const d={name:$('#fn').value.trim(),cat:$('#fc').value,price:Math.round(+$('#fp').value),emoji:$('#fe').value.trim()||'🍽️',desc:$('#fd').value.trim(),img:S.tmpImg||'',avail:$('#fa').checked};
  if(d.name.length<2)return $('#fer').textContent='Enter a food name.';
  if(!(d.price>=0)||$('#fp').value==='')return $('#fer').textContent='Enter a valid price.';
  if(d.img&&!/^(https?:\/\/|data:image\/)/i.test(d.img))return $('#fer').textContent='Image link must start with http:// or https://';
  if(!d.desc)d.desc='Freshly prepared and delicious.';
  if(id)Object.assign(food(id),d);else S.foods.unshift({id:'f'+uid(),...d});
  if(!save('foods'))return;
  closeSheet();toast(id?'Food updated':'Food added');render();
}
function aCats(){
  return `<div class="card"><b>Add category</b><div class="row" style="margin-top:8px"><input class="fi" id="nc" placeholder="e.g. Desserts" onkeydown="if(event.key==='Enter')addCat()"><button class="btn sm" onclick="addCat()">Add</button></div></div>
  ${S.cats.length?S.cats.map((c,i)=>`<div class="card row sp"><div><b>${esc(c)}</b><div class="mut">${S.foods.filter(f=>f.cat===c).length} items</div></div><div class="row"><button class="btn gray sm" onclick="renCat(${i})">Rename</button><button class="btn danger sm" onclick="delCat(${i})">Delete</button></div></div>`).join(''):empty('🏷️','No categories','Add a category above.')}`;
}
function addCat(){const v=$('#nc').value.trim();if(!v)return toast('Enter a category name');if(S.cats.some(c=>c.toLowerCase()===v.toLowerCase()))return toast('Category already exists');S.cats.push(v);save('cats');toast('Category added');render()}
function renCat(i){const o=S.cats[i],n=(prompt('Rename category',o)||'').trim();if(!n||n===o)return;if(S.cats.some((c,k)=>k!==i&&c.toLowerCase()===n.toLowerCase()))return toast('Name already used');S.foods.forEach(f=>{if(f.cat===o)f.cat=n});S.cats[i]=n;save('cats');save('foods');toast('Category renamed');render()}
function delCat(i){const c=S.cats[i];if(S.foods.some(f=>f.cat===c))return toast('Move or delete the foods in this category first');if(!confirm(`Delete "${c}"?`))return;S.cats.splice(i,1);save('cats');S.cat='All';toast('Category deleted');render()}
function aOrders(){
  if(isOwner() && !adminOrdersUnsub) watchAdminOrders();
  const r=S.orders.filter(o=>S.of==='All'||o.status===S.of);
  return `<div class="chips">${['All',...STAT].map(s=>`<button class="chip ${S.of===s?'on':''}" onclick="S.of='${s}';render()">${s}${s==='All'?'':' ('+S.orders.filter(o=>o.status===s).length+')'}</button>`).join('')}</div>
  ${r.length?r.map(o=>{const i=STAT.indexOf(o.status);return `<div class="card"><div class="row sp"><b>${o.id}</b><span class="badge-s st${i}">${o.status}</span></div><div class="mut">${fdate(o.created)} · ${o.payment}</div>
  <div style="margin:10px 0;padding:10px;background:#f6f7fb;border-radius:12px"><b>👤 ${esc(o.customer.name)}</b><br>📞 <a href="tel:${esc(o.customer.phone)}">${esc(o.customer.phone)}</a><br>📍 ${esc(o.customer.address)}${o.customer.note?`<br>📝 ${esc(o.customer.note)}`:''}</div>
  ${o.items.map(x=>`<div class="row sp"><span>${x.qty} × ${esc(x.name)}</span><span>${rs(x.price*x.qty)}</span></div>`).join('')}
  <div class="row sp" style="margin:8px 0"><b>Total</b><b class="price">${rs(o.total)}</b></div>
  <div class="row"><select class="fi" style="padding:9px" onchange="setStatus('${o.id}',this.value)">${STAT.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select>
  ${i<4?`<button class="btn blue sm" style="white-space:nowrap" onclick="setStatus('${o.id}','${STAT[i+1]}')">Next ›</button>`:''}</div></div>`}).join(''):empty('🧾','No orders here','Orders with this status will appear in this list.')}`;
}
async function setStatus(id,s){
  if(!isOwner())return toast('Please log in as restaurant owner first');
  try{await saveOrderStatus(id,s);toast(`${id} → ${s}`)}catch(e){console.error(e);toast(e.message||'Could not update order')}
}
function aSet(){
  return `<div class="card"><b>Restaurant owner account</b><p class="mut">Owner login is managed securely through Firebase Authentication.</p><p class="mut"><b>Restaurant ID:</b> ${RESTAURANT_ID}</p></div>
  <div class="card"><b>Data & security</b><p class="mut">Customer orders are stored as individual Firestore documents. Only the registered owner should be allowed to read and update this restaurant's orders through Firestore Security Rules.</p></div>
  <button class="btn gray" onclick="logout()">Log out</button>`;
}
function resetAll(){
  if(!confirm('This deletes all foods, orders, customers and carts on this device. Continue?'))return;
  Object.keys(localStorage).filter(k=>k.startsWith('nof_')).forEach(k=>localStorage.removeItem(k));
  try{sessionStorage.clear()}catch(e){}load();toast('App reset');render();
}

/* ---------- Start ---------- */
function init(){
  const R=$('#root');
  $('#layer').innerHTML=`<div class="splash" id="spl"><div class="lg">🍛</div><h1>Nepali Online Food</h1><small>Order directly from our restaurant</small><div class="ld"><i></i></div><small style="position:absolute;bottom:24px">Built by Niraj Xettri</small></div>`;
  setTimeout(async()=>{
    try{
      if(!window.localStorage)throw new Error('Storage unavailable');
      load();render();
      if(FIREBASE_ONLINE&&AUTH()){
        if(S.adminIn&&isOwner())watchAdminOrders();
        const u=await ensureCustomerAuth();
        if(u)watchCustomerOrders();
      }
      syncCatalog();
      history.replaceState({root:1},'');history.pushState({v:'home'},'');
      try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
      const s=$('#spl');if(s){s.style.opacity=0;setTimeout(()=>{if($('#spl'))$('#layer').innerHTML=''},400)}
    }catch(e){
      console.error(e);$('#layer').innerHTML='';R.innerHTML=header('Something went wrong')+`<main>${empty('⚠️','Could not start the app',esc(e.message||'Unknown error'),`<br><button class="btn sm" onclick="init()">Retry</button>`)}</main>`;
    }
  },500);
}
// Live sync across tabs (simulates real-time backend): customer sees status changes made by admin
window.addEventListener('storage',e=>{
  if(!e.key||!e.key.startsWith('nof_')||!S.foods)return;
  S.foods=DB.get('foods',S.foods);S.cats=DB.get('cats',S.cats);S.orders=DB.get('orders',S.orders);
  if(!$('#layer').innerHTML&&!['checkout'].includes(S.view)&&document.activeElement.tagName!=='INPUT')render();
});
init();
</script>
</body>
</html>
